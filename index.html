<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanEye | AI Civic Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- MOCK DATABASE (Local Storage) ---
        const getStoredTickets = () => JSON.parse(localStorage.getItem('urbaneye_tickets')) || [
            { id: 101, category: 'Roads', priority: 'High', status: 'In Progress', description: 'Large pothole near school', location: 'Main St', created: '2023-10-01' },
            { id: 102, category: 'Sanitation', priority: 'Medium', status: 'Received', description: 'Garbage pile not cleared', location: 'Oak Rd', created: '2023-10-02' }
        ];

        function UrbanEye() {
            const [view, setView] = useState('citizen'); // citizen, admin, track
            const [tickets, setTickets] = useState(getStoredTickets());

            useEffect(() => {
                localStorage.setItem('urbaneye_tickets', JSON.stringify(tickets));
            }, [tickets]);

            return (
                <div className="min-h-screen">
                    <nav className="bg-white border-b sticky top-0 z-10 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center space-x-2">
                            <div className="bg-blue-600 p-1.5 rounded text-white font-bold text-xl">U</div>
                            <h1 className="text-xl font-bold tracking-tight">UrbanEye <span className="text-blue-600 text-xs uppercase border border-blue-600 px-1 rounded">AI Agent</span></h1>
                        </div>
                        <div className="flex space-x-6 text-sm font-semibold">
                            <button onClick={() => setView('citizen')} className={view === 'citizen' ? "text-blue-600" : "text-gray-500 hover:text-black"}>Report Issue</button>
                            <button onClick={() => setView('track')} className={view === 'track' ? "text-blue-600" : "text-gray-500 hover:text-black"}>Track Ticket</button>
                            <button onClick={() => setView('admin')} className="bg-black text-white px-4 py-1.5 rounded-md">Admin Portal</button>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto p-6">
                        {view === 'citizen' && <CitizenForm onNewTicket={(t) => setTickets([t, ...tickets])} />}
                        {view === 'admin' && <AdminDashboard tickets={tickets} setTickets={setTickets} />}
                        {view === 'track' && <TicketTracker tickets={tickets} />}
                    </main>
                </div>
            );
        }

        function CitizenForm({ onNewTicket }) {
            const [loading, setLoading] = useState(false);
            const [submitted, setSubmitted] = useState(null);

            const handleSubmit = (e) => {
                e.preventDefault();
                setLoading(true);
                // Simulate AI Processing (Mocking Gemini API)
                setTimeout(() => {
                    const newTicket = {
                        id: Math.floor(Math.random() * 900) + 100,
                        description: e.target.desc.value,
                        category: ['Roads', 'Sanitation', 'Water Supply'][Math.floor(Math.random() * 3)],
                        priority: ['High', 'Medium', 'Low'][Math.floor(Math.random() * 3)],
                        status: 'Received',
                        location: 'Auto-detected: 12.97° N, 77.59° E',
                        created: new Date().toISOString().split('T')[0]
                    };
                    onNewTicket(newTicket);
                    setSubmitted(newTicket.id);
                    setLoading(false);
                }, 2000);
            };

            if (submitted) return (
                <div className="max-w-md mx-auto bg-white border-2 border-green-500 p-8 text-center mt-20">
                    <div className="text-green-500 text-5xl mb-4">✓</div>
                    <h2 className="text-2xl font-bold">Ticket Generated!</h2>
                    <p className="text-gray-600 mt-2">Your Ticket ID is <span className="text-black font-bold text-xl">#{submitted}</span></p>
                    <p className="text-xs text-gray-400 mt-4 italic underline cursor-pointer" onClick={() => setSubmitted(null)}>Report another issue</p>
                </div>
            );

            return (
                <div className="max-w-xl mx-auto bg-white p-8 border border-gray-200 shadow-sm mt-10">
                    <h2 className="text-2xl font-bold mb-6">File a Civic Complaint</h2>
                    <form className="space-y-4" onSubmit={handleSubmit}>
                        <div>
                            <label className="block text-sm font-bold mb-1">Issue Description</label>
                            <textarea name="desc" required className="w-full border p-3 rounded h-32 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Explain the problem (e.g., Water leakage on 5th cross road)..."></textarea>
                        </div>
                        <div className="bg-blue-50 p-3 rounded text-sm text-blue-700 flex items-center">
                            <span>📍 Location: Automatically using GPS (12.9716, 77.5946)</span>
                        </div>
                        <button disabled={loading} className="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition-all">
                            {loading ? "AI Agent is Analyzing..." : "Submit Grievance"}
                        </button>
                    </form>
                </div>
            );
        }

        function AdminDashboard({ tickets, setTickets }) {
            const updateStatus = (id, status) => {
                setTickets(tickets.map(t => t.id === id ? {...t, status} : t));
            };

            return (
                <div className="animate-in fade-in duration-500">
                    <div className="flex justify-between items-center mb-8">
                        <h2 className="text-3xl font-black">Municipal Dashboard</h2>
                        <div className="flex space-x-2">
                             <div className="bg-white border px-4 py-2 text-center"><p className="text-xs text-gray-500 uppercase">Total</p><p className="font-bold">{tickets.length}</p></div>
                             <div className="bg-white border px-4 py-2 text-center text-red-600"><p className="text-xs text-gray-500 uppercase">Critical</p><p className="font-bold">{tickets.filter(t => t.priority==='High').length}</p></div>
                        </div>
                    </div>

                    <div className="bg-white border rounded shadow-sm overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50 border-b text-xs font-bold uppercase text-gray-500 tracking-wider">
                                <tr>
                                    <th className="p-4">ID</th>
                                    <th className="p-4">Complaint</th>
                                    <th className="p-4">Category</th>
                                    <th className="p-4">Priority</th>
                                    <th className="p-4">Status</th>
                                    <th className="p-4">Action</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y text-sm">
                                {tickets.map(t => (
                                    <tr key={t.id} className="hover:bg-gray-50">
                                        <td className="p-4 font-bold">#{t.id}</td>
                                        <td className="p-4 max-w-xs truncate">{t.description}</td>
                                        <td className="p-4"><span className="bg-gray-100 px-2 py-0.5 rounded border">{t.category}</span></td>
                                        <td className="p-4">
                                            <span className={`px-2 py-1 rounded text-xs font-bold ${t.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                {t.priority}
                                            </span>
                                        </td>
                                        <td className="p-4 font-medium text-blue-600">{t.status}</td>
                                        <td className="p-4">
                                            <select 
                                                className="border rounded text-xs p-1"
                                                onChange={(e) => updateStatus(t.id, e.target.value)}
                                            >
                                                <option>Change</option>
                                                <option value="Assigned">Assign</option>
                                                <option value="In Progress">In Progress</option>
                                                <option value="Resolved">Resolve</option>
                                            </select>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function TicketTracker({ tickets }) {
            const [search, setSearch] = useState('');
            const [result, setResult] = useState(null);

            const findTicket = () => {
                const t = tickets.find(x => x.id == search);
                setResult(t || 'not_found');
            };

            return (
                <div className="max-w-md mx-auto mt-10">
                    <h2 className="text-xl font-bold mb-4">Track Grievance Status</h2>
                    <div className="flex space-x-2 mb-8">
                        <input className="flex-1 border p-3 rounded" placeholder="Enter Ticket ID (e.g. 101)" onChange={e => setSearch(e.target.value)} />
                        <button onClick={findTicket} className="bg-blue-600 text-white px-6 rounded font-bold">Track</button>
                    </div>

                    {result === 'not_found' && <p className="text-red-500 text-center">Ticket not found.</p>}
                    {result && result !== 'not_found' && (
                        <div className="bg-white border p-6 shadow-sm border-l-4 border-l-blue-600">
                            <p className="text-xs uppercase font-bold text-gray-400">Status Update</p>
                            <h3 className="text-3xl font-black mb-4">{result.status}</h3>
                            <div className="space-y-2 text-sm">
                                <p><strong>Category:</strong> {result.category}</p>
                                <p><strong>Location:</strong> {result.location}</p>
                                <p><strong>Expected Resolution:</strong> 3-5 Working Days</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<UrbanEye />);
    </script>
</body>
</html>
